name: Azure F0 - Windows x64 test build

on:
  push:
    branches:
      - azure-f0-throttling
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout patched sources
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore and compile Subtitle Edit
        run: |
          dotnet restore src/ui/UI.csproj
          dotnet build src/ui/UI.csproj --configuration Release --no-restore

      - name: Publish self-contained Windows x64
        shell: pwsh
        run: |
          dotnet publish src/ui/UI.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:DebugSymbols=false `
            -p:DebugType=none `
            -o ./publish/azure-f0-win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Include Windows media playback library
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/SubtitleEdit/support-files/releases/download/libmpv-2026-08-14b/libmpv2-win64.zip" -OutFile "libmpv2-64.zip"
          Expand-Archive -Path "libmpv2-64.zip" -DestinationPath "libmpv-temp"
          Copy-Item "libmpv-temp/*" "./publish/azure-f0-win-x64/"
          Copy-Item "./LICENSE" "./publish/azure-f0-win-x64/LICENSE"
          Get-ChildItem "./publish/azure-f0-win-x64" -Filter "*.pdb" -Recurse -File | Remove-Item -Force
          Remove-Item "./publish/azure-f0-win-x64/libse.xml" -Force -ErrorAction SilentlyContinue

      - name: Package Windows portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path "./publish/azure-f0-win-x64/*" -DestinationPath "./SubtitleEdit-AzureF0-Windows-x64.zip"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SubtitleEdit-AzureF0-Windows-x64
          path: ./SubtitleEdit-AzureF0-Windows-x64.zip
          if-no-files-found: error
