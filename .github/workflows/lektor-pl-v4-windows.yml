name: Lektor PL v4 - Windows x64

on:
  push:
    branches:
      - azure-f0-lektor-pl-v4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout v4 sources
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install FFmpeg and MKVToolNix for integration tests
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ffmpeg = (Get-Command ffmpeg).Source
          "FFMPEG_TEST_PATH=$ffmpeg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $ffmpeg -version
          choco install mkvtoolnix --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $mkvmerge = "C:\Program Files\MKVToolNix\mkvmerge.exe"
          if (!(Test-Path $mkvmerge)) { throw "mkvmerge not found" }
          "MKVMERGE_TEST_PATH=$mkvmerge" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $mkvmerge --version

      - name: Build and verify Lektor PL export
        shell: pwsh
        run: |
          dotnet test tests/UI/UITests.csproj -c Release --filter "FullyQualifiedName~LektorExportTests" --logger "trx;LogFileName=lektor-v4.trx"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish Windows portable build
        shell: pwsh
        run: |
          dotnet publish src/ui/UI.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:DebugSymbols=false -p:DebugType=none `
            -o ./publish/lektor-pl-v4-win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Invoke-WebRequest -Uri "https://github.com/SubtitleEdit/support-files/releases/download/libmpv-2026-08-14b/libmpv2-win64.zip" -OutFile "libmpv2-64.zip"
          Expand-Archive -Path "libmpv2-64.zip" -DestinationPath "libmpv-temp"
          Copy-Item "libmpv-temp/*" "./publish/lektor-pl-v4-win-x64/"
          Copy-Item "./LICENSE" "./publish/lektor-pl-v4-win-x64/LICENSE"
          Copy-Item "./docs/lektor-pl-v4.md" "./publish/lektor-pl-v4-win-x64/Lektor-PL-v4.md"
          # Ship the working MKVToolNix installation (including DLLs and license files).
          Copy-Item "C:\Program Files\MKVToolNix" "./publish/lektor-pl-v4-win-x64/MKVToolNix" -Recurse
          Get-ChildItem "./publish/lektor-pl-v4-win-x64" -Filter "*.pdb" -Recurse -File | Remove-Item -Force
          Compress-Archive -Path "./publish/lektor-pl-v4-win-x64/*" -DestinationPath "./SubtitleEdit-LektorPL-v4.2.1-Windows-x64.zip"

      - name: Upload portable build
        uses: actions/upload-artifact@v5
        with:
          name: SubtitleEdit-LektorPL-v4.2.1-Windows-x64
          path: ./SubtitleEdit-LektorPL-v4.2.1-Windows-x64.zip
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: LektorPL-v4-test-results
          path: tests/UI/TestResults/*.trx
          if-no-files-found: warn
